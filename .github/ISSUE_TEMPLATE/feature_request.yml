name: 💡 Feature Request
description: Suggest new testing patterns or documentation improvements
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Help us understand your idea.

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      description: What kind of enhancement are you suggesting?
      options:
        - New testing pattern
        - New testing scenario
        - Documentation improvement
        - Additional examples
        - Better error handling guidance
        - Performance optimization tips
        - Integration with other tools
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Describe the problem or gap in current documentation...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like to see this addressed?
      placeholder: Describe your proposed solution or improvement...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there any alternative approaches you've considered?
      placeholder: Describe alternatives...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Code Examples
      description: If applicable, provide example code or usage scenarios
      placeholder: |
        ```csharp
        // Example of what this would look like
        ```
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to contribute this feature?
      options:
        - label: I'm willing to submit a pull request for this feature
          required: false
